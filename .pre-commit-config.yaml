---
ci:
  skip: [nixfmt-nix, statix-check, statix-fix, ggshield]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: detect-private-key

  - repo: https://github.com/fidgetingbits/pre-commit-statix
    rev: v1.0.0
    hooks:
      - id: statix-check
        exclude: '\.agents/'
      - id: statix-fix
        exclude: '\.agents/'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: 'secrets\.yaml|\.sops\.yaml|\.agents/'

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: '\.agents/|config/opencode/command/'
      - id: markdownlint-fix
        exclude: '\.agents/|config/opencode/command/'

  - repo: https://github.com/NixOS/nixfmt
    rev: v1.4.0
    hooks:
      - id: nixfmt-nix
        exclude: '\.agents/'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json, gitignore]
        exclude: '\.agents/|config/opencode/command/'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/GitGuardian/ggshield
    rev: v1.52.2
    hooks:
      - id: ggshield

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies: [typer]
        args: [--no-strict-optional, --ignore-missing-imports]
