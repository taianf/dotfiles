---
repos:
  - repo: https://github.com/fidgetingbits/pre-commit-statix
    rev: v1.0.0
    hooks:
      - id: statix-check
        exclude: '\.agents/'
      - id: statix-fix
        exclude: '\.agents/'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: 'secrets\.yaml|\.sops\.yaml|\.agents/'

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: '\.agents/'

  - repo: https://github.com/NixOS/nixfmt
    rev: v1.4.0
    hooks:
      - id: nixfmt-nix
        exclude: '\.agents/'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json, gitignore]
        exclude: '\.agents/'
